name: AppleHomeObserver
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_IDENTITY: Apple Development
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AppleHomeObserver:
    type: application
    info:
      path: build/generated/AppleHomeObserver-Info.plist
      properties:
        ObserverMonitoringFolder: $(OBSERVER_MONITORING_FOLDER)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    platform: iOS
    sources:
      - App
      - Sources/ObserverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OBSERVER_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppleHomeObserver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHomeKitUsageDescription: 'Back up Home configuration and observe metadata and blind command outcomes. Restores require an explicit preview and Apply.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/AppleHomeObserver.entitlements
        TARGETED_DEVICE_FAMILY: '2'
        'TARGETED_DEVICE_FAMILY[sdk=macosx*]': '6'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: 'Apple Home Observer'
        ENABLE_APP_SANDBOX: YES

  AcceptanceApp:
    type: application
    info:
      path: build/generated/AcceptanceApp-Info.plist
      properties:
        ObserverMonitoringFolder: $(OBSERVER_MONITORING_FOLDER)
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    platform: iOS
    sources:
      - App
      - Sources/ObserverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AppleHomeObserver.Acceptance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppleHomeObserver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHomeKitUsageDescription: 'Back up Home configuration and observe metadata and blind command outcomes. Restores require an explicit preview and Apply.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/Acceptance.entitlements
        TARGETED_DEVICE_FAMILY: '2'
        'TARGETED_DEVICE_FAMILY[sdk=macosx*]': '6'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: 'Observer Acceptance'
        ENABLE_APP_SANDBOX: YES
        DEVELOPMENT_TEAM: ''
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ''
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) OBSERVER_ACCEPTANCE

  AccessibilityUITests:
    type: bundle.ui-testing
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AppleHomeObserver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OBSERVER_BUNDLE_ID).AccessibilityUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ''
        TEST_TARGET_NAME: AppleHomeObserver
  NativeAcceptanceTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [NativeUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AppleHomeObserver.NativeTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: macosx
schemes:
  AcceptanceFixture:
    build:
      targets:
        AcceptanceApp: all
  NativeAcceptance:
    build:
      targets:
        NativeAcceptanceTests: [test]
    test:
      targets: [NativeAcceptanceTests]
  AppleHomeObserver:
    build:
      targets:
        AppleHomeObserver: all
  AccessibilityAudit:
    build:
      targets:
        AppleHomeObserver: all
        AccessibilityUITests: [test]
    test:
      targets: [AccessibilityUITests]
