name: Verify
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Check public source
        run: python3 script/check-public-source.py
      - name: Build offline verifier
        run: swift build --product aho-verify
      - name: Core tests
        run: swift test
      - name: Ciphertext packaging tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
